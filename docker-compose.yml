services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - tracker
    restart: unless-stopped

  tracker:
    build: ./tracker
    container_name: tracker
    volumes:
      - ./tracker/data:/app/data
    environment:
      - TZ=Asia/Yekaterinburg
      # Telegram-уведомления (опционально): раскомментируйте и подставьте
      # свои значения. Без них стенд работает, уведомления просто не шлются.
      # - TG_BOT_TOKEN=<токен от @BotFather>
      # - TG_CHAT_ID=<id вашего чата с ботом>
    restart: unless-stopped

  # Локальный почтовый сервер для демонстрации и тестов:
  # ловит все письма и показывает их в веб-интерфейсе http://localhost:8025
  # (наружу ничего не отправляет). Реальная рассылка на внешние адреса —
  # через --smtp-host <реальный сервер> в mailer.
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025" # веб-интерфейс; SMTP 1025 торчит только в сеть compose
    restart: unless-stopped

  # Mailer — CLI-инструмент, в фоне не работает и при `docker compose up -d`
  # не запускается (profiles). Рассылка:
  #   docker compose run --rm mailer --smtp-host mail.test.ru --base-url <IP стенда>
  mailer:
    build: ./mailer
    profiles: ["cli"]
    volumes:
      - ./mailer/data:/app/data
    environment:
      - TZ=Asia/Yekaterinburg
      - BASE_URL=http://localhost:8084
    working_dir: /app

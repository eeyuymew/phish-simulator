services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - tracker
    restart: unless-stopped

  tracker:
    build: ./tracker
    container_name: tracker
    volumes:
      - ./tracker/data:/app/data
    environment:
      - TZ=Asia/Yekaterinburg
    restart: unless-stopped

  # Mailer — CLI-инструмент, в фоне не работает и при `docker compose up -d`
  # не запускается (profiles). Рассылка:
  #   docker compose run --rm mailer --smtp-host mail.test.ru --base-url <IP стенда>
  mailer:
    build: ./mailer
    profiles: ["cli"]
    volumes:
      - ./mailer/data:/app/data
    environment:
      - TZ=Asia/Yekaterinburg
      - BASE_URL=http://localhost:8084
    working_dir: /app
